<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Section</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/hero-section.css" />
  </head>
  <body>
    <!-- 3D Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Vignette overlay -->
    <div class="vignette"></div>

    <!-- Navbar -->
    <nav>
      <a class="nav-logo" href="#">AXIOM</a>
      <ul class="nav-links">
        <li><a href="#">Features</a></li>
        <li><a href="#">Pricing</a></li>
        <li><a href="#">Docs</a></li>
        <li><a href="#">Blog</a></li>
      </ul>
    </nav>

    <!-- Hero -->
    <section class="hero">
      <p class="hero-label">Next-Generation Platform</p>

      <h1 class="hero-headline">Build<br />the Future</h1>

      <p class="hero-sub">
        The most powerful toolkit for teams who refuse to compromise — ship
        faster, scale further, look incredible.
      </p>

      <div class="feature-cards">
        <div class="card">
          <svg
            class="card-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
          Blazing Fast
        </div>
        <div class="card">
          <svg
            class="card-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
          Enterprise Security
        </div>
        <div class="card">
          <svg
            class="card-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <circle cx="12" cy="12" r="10" />
            <path
              d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
            />
          </svg>
          Global Scale
        </div>
        <div class="card">
          <svg
            class="card-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
          Pricing
        </div>
      </div>

      <div class="cta-wrap">
        <a href="#" class="cta-btn">
          Get Started
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </a>
      </div>
    </section>

    <!-- Scroll hint -->
    <div class="scroll-hint">
      <div class="scroll-hint-line"></div>
      <span>Scroll</span>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  </body>
</html>
